<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1080, height=1920" />
<script src="vendor/gsap.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; background: #0b0d12; }
  #root { position: relative; width: 100%; height: 100%; font-family: system-ui, sans-serif; color: #f5f5f7; }
  .clip { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 0 90px; }
  h1 { font-size: 110px; font-weight: 800; letter-spacing: -0.03em; line-height: 1.02; }
  p { font-size: 44px; opacity: .7; margin-top: 28px; }
  .accent { color: #ffb020; }
  .bar { width: 0; height: 10px; background: #ffb020; border-radius: 6px; margin-top: 40px; }
  .cta { font-size: 64px; font-weight: 700; padding: 34px 60px; border: 4px solid #ffb020; border-radius: 999px; }
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-duration="6" data-width="1080" data-height="1920">
  <div id="s1" class="clip" data-start="0" data-duration="2.2" data-track-index="1">
    <h1 id="h1">Storyboard<br><span class="accent">first.</span></h1><div id="bar" class="bar"></div>
  </div>
  <div id="s2" class="clip" data-start="2.2" data-duration="2" data-track-index="1">
    <h1 id="h2">Build. Review.<br>Fix.</h1><p id="p2">Pipeline test render</p>
  </div>
  <div id="s3" class="clip" data-start="4.2" data-duration="1.8" data-track-index="1">
    <div id="cta" class="cta">[[YOUR CTA]]</div>
  </div>
</div>
<script>
  const tl = gsap.timeline({ paused: true });
  tl.fromTo("#h1", { opacity: 0, y: 60 }, { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" }, 0.1)
    .to("#bar", { width: 420, duration: 0.7, ease: "power2.inOut" }, 0.6)
    .fromTo("#h2", { opacity: 0, scale: 0.9 }, { opacity: 1, scale: 1, duration: 0.5, ease: "back.out(1.6)" }, 2.25)
    .fromTo("#p2", { opacity: 0 }, { opacity: 0.7, duration: 0.4 }, 2.7)
    .fromTo("#cta", { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 4.3);
  window.__timelines["main"] = tl;
  tl.seek(0);
</script>
</body>
</html>
